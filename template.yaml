
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud Resume Challenge - Visitor Counter API

Globals:
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - https://demetgoktas.me
      AllowHeaders:
        - Content-Type
      AllowMethods:
        - GET

Resources:
  VisitorCounterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: visitorCounterSam
      CodeUri: website/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: visitorCounter
      Events:
        CounterApi:
          Type: HttpApi
          Properties:
            Path: /count
            Method: GET
