
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud Resume Challenge - Visitor Counter API

Globals:
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - https://demetgoktas.me
      AllowHeaders:
        - Content-Type
      AllowMethods:
        - GET

Resources:
  VisitorCounterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: visitorCounterSam
      CodeUri: website/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt VisitorCounterTable.Arn
      Events:
        CounterApi:
          Type: HttpApi
          Properties:
            Path: /count
            Method: GET
  VisitorCounterTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: visitorCounter
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: N
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
