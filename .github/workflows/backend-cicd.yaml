
name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "template.yaml"
      - ".github/workflows/backend-cicd.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - "template.yaml"
      - ".github/workflows/backend-cicd.yaml"

permissions:
  contents: read

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r website/requirements.txt

      - name: Run unit tests
        working-directory: website
        run: python -m unittest -v test_lambda_function.py

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: sam validate --lint

      - name: Build SAM application
        run: sam build

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::678524951755:role/GitHubActionsBackendDeployRole
          aws-region: eu-north-1

      - name: Deploy to AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sam deploy \
            --stack-name cloud-resume-challenge-sam \
            --region eu-north-1 \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
